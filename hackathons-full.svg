<svg xmlns="http://www.w3.org/2000/svg" viewBox="-24 -24 928 508" role="img" aria-label="2 hackathon wins, 5 podium finishes">
<style>
  :root{background:#0B0D10}
  .lbl{font:600 11px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;letter-spacing:.12em;fill:#8B8F98}
  .val{font:700 26px -apple-system,'Segoe UI',Inter,Helvetica,Arial,sans-serif;fill:#ECE7DD}
  .sub{font:500 13px -apple-system,'Segoe UI',Inter,Helvetica,Arial,sans-serif;fill:#8B8F98}
  .ttl{font:700 15px -apple-system,'Segoe UI',Inter,Helvetica,Arial,sans-serif;fill:#ECE7DD}
  .cap{font:500 11px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#8B8F98}
  .txt{font:500 14px -apple-system,'Segoe UI',Inter,Helvetica,Arial,sans-serif;fill:#ECE7DD}
  .fade{transition:opacity .2s}

  .rk{font:700 13px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#ECE7DD;letter-spacing:.06em}
  .p{animation:rise .8s cubic-bezier(.2,.8,.2,1) both}
  @keyframes rise{from{opacity:0;transform:translateY(40px)}to{opacity:1;transform:none}}
  .lift{transition:transform .25s cubic-bezier(.2,.8,.2,1),filter .25s}
  .p:hover .lift{transform:translateY(-14px);filter:brightness(1.2)}
  .hl{fill:#181B21;stroke:#23272E;opacity:0;transition:opacity .15s}
  .row:hover .hl{opacity:1}
  #h0:hover~#r0 .hl,#h1:hover~#r1 .hl,#h2:hover~#r2 .hl,#h3:hover~#r3 .hl,#h4:hover~#r4 .hl{opacity:1}
  .det{opacity:0;transition:opacity .15s}
  .p:hover~#detail #dd,.row:hover~#detail #dd{opacity:0}
  #h0:hover~#detail #d0,#r0:hover~#detail #d0,#h1:hover~#detail #d1,#r1:hover~#detail #d1,#h2:hover~#detail #d2,#r2:hover~#detail #d2,#h3:hover~#detail #d3,#r3:hover~#detail #d3,#h4:hover~#detail #d4,#r4:hover~#detail #d4{opacity:1}
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
