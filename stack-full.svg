  .txt{font:500 14px -apple-system,'Segoe UI',Inter,Helvetica,Arial,sans-serif;fill:#ECE7DD}
  .fade{transition:opacity .2s}
  .chip{font:500 11.5px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#ECE7DD}
  .big{font:700 22px -apple-system,'Segoe UI',Inter,Helvetica,Arial,sans-serif;fill:#ECE7DD}
  .hit{fill:none;stroke:transparent;stroke-width:30}
  .orbit{fill:none;stroke:#23272E;stroke-dasharray:3 5;transition:stroke .2s}
  .node rect{fill:#181B21;stroke:#23272E;transition:fill .2s}
  .node:hover rect{fill:#FF7A3D}
  .node:hover text{fill:#0B0D10}
  .ring{transition:opacity .25s}
  #sys:hover .ring{opacity:.25}
  #sys .ring:hover{opacity:1}
  .ring:hover .orbit{stroke:#FF7A3D;stroke-dasharray:none}
  .foc{opacity:0;transition:opacity .2s}
  .ring:hover~#panel #pdef{opacity:0}
  .float{animation:float 4s ease-in-out infinite}
  @keyframes float{50%{transform:translateY(-6px)}}
  #s0:hover~#panel #c0,#s1:hover~#panel #c1,#s2:hover~#panel #c2,#s3:hover~#panel #c3{opacity:1}
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
