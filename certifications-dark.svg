<svg xmlns="http://www.w3.org/2000/svg" width="880" height="340" viewBox="0 0 880 340" role="img" aria-label="Certifications: Google, Oracle, Git, OPSWAT, RapidMiner, Forage, Great Learning">
<style>
  .lbl{font:600 11px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;letter-spacing:.12em;fill:#8B8F98}
  .val{font:700 26px -apple-system,'Segoe UI',Inter,Helvetica,Arial,sans-serif;fill:#ECE7DD}
  .sub{font:500 13px -apple-system,'Segoe UI',Inter,Helvetica,Arial,sans-serif;fill:#8B8F98}
  .ttl{font:700 15px -apple-system,'Segoe UI',Inter,Helvetica,Arial,sans-serif;fill:#ECE7DD}
  .cap{font:500 11px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#8B8F98}
  .txt{font:500 14px -apple-system,'Segoe UI',Inter,Helvetica,Arial,sans-serif;fill:#ECE7DD}
  .fade{transition:opacity .2s}

  .mark{font:700 20px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#FF7A3D}
  .hf{fill:#181B21;stroke:#23272E}
  .bk{font:700 14px -apple-system,'Segoe UI',Inter,Helvetica,Arial,sans-serif;fill:#0B0D10}
  .bks{font:600 9.5px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;letter-spacing:.1em;fill:#0B0D10}
  .front,.back,.hx{transform-box:fill-box;transform-origin:center}
  .front,.back{transition:transform .18s ease-in}
  .back{transform:scaleX(0)}
  .hx:hover .front{transform:scaleX(0)}
  .hx:hover .back{transform:scaleX(1);transition-delay:.18s;transition-timing-function:ease-out}
  .hx{animation:pop .5s cubic-bezier(.3,1.4,.5,1) both}
  @keyframes pop{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:none}}
  .huge{font:800 72px -apple-system,'Segoe UI',Inter,Helvetica,Arial,sans-serif;fill:#ECE7DD;letter-spacing:-2px}
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
