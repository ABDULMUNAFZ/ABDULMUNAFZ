name: Generate profile graphics

permissions:
  contents: write

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - "data/**"
      - ".github/workflows/profile-graphics.yml"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Generate 3D contribution calendar
        run: node scripts/iso-calendar.mjs ${{ github.repository_owner }} dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate language and numbers card
        run: node scripts/github-stats.mjs ${{ github.repository_owner }} dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate section cards
        run: node scripts/cards.mjs dist

      - name: Sync README tooltips with profile data
        if: github.ref == 'refs/heads/main'
        run: |
          node scripts/readme.mjs
          if ! git diff --quiet README.md; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Sync README with data/profile.json" README.md
            git push
          fi

      - name: Generate snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?color_snake=#D9551F&color_dots=#E7E2D9,#F6C9A8,#F09A62,#DC6428,#A9431A
            dist/snake-dark.svg?color_snake=#FF7A3D&color_dots=#1A1D23,#5A2A14,#9A4421,#E0662E,#FFA066

      - name: Deploy to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
