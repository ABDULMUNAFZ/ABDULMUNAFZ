<svg xmlns="http://www.w3.org/2000/svg" width="880" height="460" viewBox="0 0 880 460" role="img" aria-label="2 hackathon wins, 5 podium finishes">
<style>
  .lbl{font:600 11px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;letter-spacing:.12em;fill:#746B64}
  .dots{fill:url(#dots)}
  .val{font:700 26px -apple-system,'Segoe UI',Inter,Helvetica,Arial,sans-serif;fill:#1B1B1B}
  .sub{font:500 13px -apple-system,'Segoe UI',Inter,Helvetica,Arial,sans-serif;fill:#746B64}
  .ttl{font:700 15px -apple-system,'Segoe UI',Inter,Helvetica,Arial,sans-serif;fill:#1B1B1B}
  .cap{font:500 11px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#746B64}
  .txt{font:500 14px -apple-system,'Segoe UI',Inter,Helvetica,Arial,sans-serif;fill:#1B1B1B}
  .fade{transition:opacity .2s}

  .rk{font:700 13px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#1B1B1B;letter-spacing:.06em}
  .p{animation:rise .8s cubic-bezier(.2,.8,.2,1) both}
  @keyframes rise{from{opacity:0;transform:translateY(40px)}to{opacity:1;transform:none}}
  .lift{transition:transform .25s cubic-bezier(.2,.8,.2,1),filter .25s}
  .p:hover .lift{transform:translateY(-14px);filter:brightness(1.2)}
  .hl{fill:#FFFFFF;stroke:#D9C9BB;opacity:0;transition:opacity .15s}
  .row:hover .hl{opacity:1}
  #h0:hover~#r0 .hl,#h1:hover~#r1 .hl,#h2:hover~#r2 .hl,#h3:hover~#r3 .hl,#h4:hover~#r4 .hl{opacity:1}
  .det{opacity:0;transition:opacity .15s}
  .p:hover~#detail #dd,.row:hover~#detail #dd{opacity:0}
  #h0:hover~#detail #d0,#r0:hover~#detail #d0,#h1:hover~#detail #d1,#r1:hover~#detail #d1,#h2:hover~#detail #d2,#r2:hover~#detail #d2,#h3:hover~#detail #d3,#r3:hover~#detail #d3,#h4:hover~#detail #d4,#r4:hover~#detail #d4{opacity:1}
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
<defs>
  <linearGradient id="shell" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#FFFFFF"/><stop offset="1" stop-color="#F0EAE4"/></linearGradient>
  <radialGradient id="halo" cx="92%" cy="0%" r="70%"><stop stop-color="#D94316" stop-opacity=".16"/><stop offset="1" stop-color="#D94316" stop-opacity="0"/></radialGradient>
  <pattern id="dots" width="7" height="7" patternUnits="userSpaceOnUse"><circle cx="3.5" cy="3.5" r="1.65" fill="#1B1B1B"/></pattern>
</defs>
<rect x="0" y="0" width="880" height="460" rx="24" fill="#F0EAE4"/>
<rect x="12" y="12" width="856" height="436" rx="20" fill="url(#shell)" stroke="#D9C9BB"/>
<rect x="12" y="12" width="856" height="436" rx="20" fill="url(#halo)"/>
<line x1="36" y1="70" x2="844" y2="70" stroke="#D9C9BB"/>
