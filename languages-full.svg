<style>
  :root{background:#161616}
  .lbl{font:600 11px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;letter-spacing:.12em;fill:#9C948C}
  .dots{fill:url(#dots)}
  .val{font:700 26px -apple-system,'Segoe UI',Inter,Helvetica,Arial,sans-serif;fill:#ECE6E0}
  .sub{font:500 13px -apple-system,'Segoe UI',Inter,Helvetica,Arial,sans-serif;fill:#9C948C}
  .ttl{font:700 15px -apple-system,'Segoe UI',Inter,Helvetica,Arial,sans-serif;fill:#ECE6E0}
  .cap{font:500 11px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#9C948C}
  .txt{font:500 14px -apple-system,'Segoe UI',Inter,Helvetica,Arial,sans-serif;fill:#ECE6E0}
  .fade{transition:opacity .2s}

  .seg{transition:transform .2s cubic-bezier(.2,.8,.2,1),filter .2s;animation:grow .7s cubic-bezier(.2,.8,.2,1) both;transform-box:view-box}
  @keyframes grow{from{opacity:0}to{opacity:1}}
  .seg:hover{filter:brightness(1.2)}
  #g0:hover{transform:translate(8.4px,5.4px)}
  #g1:hover{transform:translate(-10.0px,-0.2px)}
  #g2:hover{transform:translate(-7.9px,-6.2px)}
  #g3:hover{transform:translate(-5.4px,-8.4px)}
  #g4:hover{transform:translate(-3.0px,-9.5px)}
  #g5:hover{transform:translate(-1.1px,-9.9px)}
  #g6:hover{transform:translate(-0.3px,-10.0px)}
  #g7:hover{transform:translate(-0.1px,-10.0px)}
  .num{font:600 12px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#9C948C}
  .pct{font:800 34px -apple-system,'Segoe UI',Inter,Helvetica,Arial,sans-serif;fill:#ECE6E0;letter-spacing:-1px}
  .hl{fill:#24211F;opacity:0;transition:opacity .15s}
  #g0:hover~#l0 .hl,#g1:hover~#l1 .hl,#g2:hover~#l2 .hl,#g3:hover~#l3 .hl,#g4:hover~#l4 .hl,#g5:hover~#l5 .hl,#g6:hover~#l6 .hl,#g7:hover~#l7 .hl{opacity:1}
  .lg:is(:hover,:focus-visible) .hl{opacity:1}
  .lg:focus-visible{outline:2px solid #FF4A1C;outline-offset:3px}
  .cc{opacity:0;transition:opacity .15s}
  .seg:hover~#center #cdef,.lg:is(:hover,:focus-visible)~#center #cdef{opacity:0}
  #g0:hover~#center #c0,#l0:hover~#center #c0,#g1:hover~#center #c1,#l1:hover~#center #c1,#g2:hover~#center #c2,#l2:hover~#center #c2,#g3:hover~#center #c3,#l3:hover~#center #c3,#g4:hover~#center #c4,#l4:hover~#center #c4,#g5:hover~#center #c5,#l5:hover~#center #c5,#g6:hover~#center #c6,#l6:hover~#center #c6,#g7:hover~#center #c7,#l7:hover~#center #c7{opacity:1}
  svg:has(.lg:focus-visible) #center .cc{opacity:0!important}
  #l0:focus-visible~#center #c0,#l1:focus-visible~#center #c1,#l2:focus-visible~#center #c2,#l3:focus-visible~#center #c3,#l4:focus-visible~#center #c4,#l5:focus-visible~#center #c5,#l6:focus-visible~#center #c6,#l7:focus-visible~#center #c7{opacity:1!important}
  .tile rect{fill:#1B1B1B;stroke:#2E2E2E;transition:stroke .2s}
  .tile:hover rect{stroke:#FF4A1C}
  .tv{font:700 22px -apple-system,'Segoe UI',Inter,Helvetica,Arial,sans-serif;fill:#ECE6E0}
  .tl{font:600 9.5px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;letter-spacing:.1em;fill:#9C948C}
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
