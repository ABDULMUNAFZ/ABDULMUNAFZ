  .txt{font:500 14px -apple-system,'Segoe UI',Inter,Helvetica,Arial,sans-serif;fill:#ECE7DD}
  .fade{transition:opacity .2s}

  .seg{transition:transform .2s cubic-bezier(.2,.8,.2,1),filter .2s;animation:grow .7s cubic-bezier(.2,.8,.2,1) both;transform-box:view-box}
  @keyframes grow{from{opacity:0}to{opacity:1}}
  .seg:hover{filter:brightness(1.2)}
  #g0:hover{transform:translate(8.4px,5.4px)}
  #g1:hover{transform:translate(-10.0px,-0.2px)}
  #g2:hover{transform:translate(-7.9px,-6.2px)}
  #g3:hover{transform:translate(-5.4px,-8.4px)}
  #g4:hover{transform:translate(-3.0px,-9.5px)}
  #g5:hover{transform:translate(-1.1px,-9.9px)}
  #g6:hover{transform:translate(-0.3px,-10.0px)}
  #g7:hover{transform:translate(-0.1px,-10.0px)}
