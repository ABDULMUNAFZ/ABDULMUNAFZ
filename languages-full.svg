  .pct{font:800 34px -apple-system,'Segoe UI',Inter,Helvetica,Arial,sans-serif;fill:#ECE7DD;letter-spacing:-1px}
  .hl{fill:#181B21;opacity:0;transition:opacity .15s}
  #g0:hover~#l0 .hl,#g1:hover~#l1 .hl,#g2:hover~#l2 .hl,#g3:hover~#l3 .hl,#g4:hover~#l4 .hl,#g5:hover~#l5 .hl,#g6:hover~#l6 .hl,#g7:hover~#l7 .hl{opacity:1}
  .lg:is(:hover,:focus-visible) .hl{opacity:1}
  .lg:focus-visible{outline:2px solid #FF7A3D;outline-offset:3px}
  .cc{opacity:0;transition:opacity .15s}
  .seg:hover~#center #cdef,.lg:is(:hover,:focus-visible)~#center #cdef{opacity:0}
  #g0:hover~#center #c0,#l0:hover~#center #c0,#g1:hover~#center #c1,#l1:hover~#center #c1,#g2:hover~#center #c2,#l2:hover~#center #c2,#g3:hover~#center #c3,#l3:hover~#center #c3,#g4:hover~#center #c4,#l4:hover~#center #c4,#g5:hover~#center #c5,#l5:hover~#center #c5,#g6:hover~#center #c6,#l6:hover~#center #c6,#g7:hover~#center #c7,#l7:hover~#center #c7{opacity:1}
  svg:has(.lg:focus-visible) #center .cc{opacity:0!important}
  #l0:focus-visible~#center #c0,#l1:focus-visible~#center #c1,#l2:focus-visible~#center #c2,#l3:focus-visible~#center #c3,#l4:focus-visible~#center #c4,#l5:focus-visible~#center #c5,#l6:focus-visible~#center #c6,#l7:focus-visible~#center #c7{opacity:1!important}
  .tile rect{fill:#13161B;stroke:#23272E;transition:stroke .2s}
  .tile:hover rect{stroke:#FF7A3D}
  .tv{font:700 22px -apple-system,'Segoe UI',Inter,Helvetica,Arial,sans-serif;fill:#ECE7DD}
  .tl{font:600 9.5px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;letter-spacing:.1em;fill:#8B8F98}
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
