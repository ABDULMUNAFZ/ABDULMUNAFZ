  #g0:hover{transform:translate(8.4px,5.5px)}
  #g1:hover{transform:translate(-9.9px,-1.4px)}
  #g2:hover{transform:translate(-6.2px,-7.8px)}
  #g3:hover{transform:translate(-3.1px,-9.5px)}
  #g4:hover{transform:translate(-1.1px,-9.9px)}
  #g5:hover{transform:translate(-0.3px,-10.0px)}
  #g6:hover{transform:translate(-0.2px,-10.0px)}
  #g7:hover{transform:translate(-0.1px,-10.0px)}
