  .pct{font:800 34px -apple-system,'Segoe UI',Inter,Helvetica,Arial,sans-serif;fill:#1A1C20;letter-spacing:-1px}
  .hl{fill:#FFFFFF;opacity:0;transition:opacity .15s}
  #g0:hover~#l0 .hl,#g1:hover~#l1 .hl,#g2:hover~#l2 .hl,#g3:hover~#l3 .hl,#g4:hover~#l4 .hl,#g5:hover~#l5 .hl,#g6:hover~#l6 .hl,#g7:hover~#l7 .hl{opacity:1}
  .lg:hover .hl{opacity:1}
  .cc{opacity:0;transition:opacity .15s}
  .seg:hover~#center #cdef{opacity:0}
  #g0:hover~#center #c0,#g1:hover~#center #c1,#g2:hover~#center #c2,#g3:hover~#center #c3,#g4:hover~#center #c4,#g5:hover~#center #c5,#g6:hover~#center #c6,#g7:hover~#center #c7{opacity:1}
  .tile rect{fill:#FFFFFF;stroke:#E2DDD3;transition:stroke .2s}
  .tile:hover rect{stroke:#D9551F}
  .tv{font:700 22px -apple-system,'Segoe UI',Inter,Helvetica,Arial,sans-serif;fill:#1A1C20}
  .tl{font:600 9.5px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;letter-spacing:.1em;fill:#6B6F78}
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
