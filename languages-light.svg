  #g0:hover{transform:translate(8.1px,5.9px)}
  #g1:hover{transform:translate(-9.6px,-2.6px)}
  #g2:hover{transform:translate(-5.3px,-8.5px)}
  #g3:hover{transform:translate(-2.6px,-9.6px)}
  #g4:hover{transform:translate(-0.9px,-10.0px)}
  #g5:hover{transform:translate(-0.3px,-10.0px)}
  #g6:hover{transform:translate(-0.2px,-10.0px)}
  #g7:hover{transform:translate(-0.1px,-10.0px)}
